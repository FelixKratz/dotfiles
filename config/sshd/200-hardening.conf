# Key-only SSH for seb; installed to /etc/ssh/sshd_config.d/ by bin/install-sshd-hardening.
# sshd keeps the first value it reads, so this must be included before the main config's settings.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PermitEmptyPasswords no
AllowUsers seb
AuthenticationMethods publickey
MaxAuthTries 3
LoginGraceTime 20
MaxStartups 10:30:60
X11Forwarding no
LogLevel VERBOSE
