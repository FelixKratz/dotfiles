prSections:
  # No status: filters. GitHub search keeps the status a PR had at its last
  # update, so one whose checks finished afterwards stays "pending" there
  # until it next changes. The checks column shows the live state.
  - title: To review
    filters: is:open review-requested:@me draft:false
  - title: Unreviewed in epiforecasts
    filters: is:open org:epiforecasts review:none -author:@me -author:sbfnk-bot draft:false
  - title: Unreviewed in mine
    filters: is:open user:sbfnk review:none -author:@me -author:sbfnk-bot draft:false
  # Approved and waiting for a merge. GitHub search cannot say who should
  # merge, so PRs by me or the bot come first, then others' PRs I approved
  # (bots, outside contributors, colleagues who may merge their own).
  - title: Ready to merge
    filters: is:open review:approved draft:false author:@me author:sbfnk-bot
  - title: Approved by me
    filters: is:open review:approved draft:false reviewed-by:@me -author:@me -author:sbfnk-bot
pager:
  diff: delta   # or "less -R" without delta

keybindings:
  prs:
    # V and M run in the background (gh-bg) and report in a notification, so
    # gh-dash does not freeze while gh works and a failure still shows.
    # gh-pr-merge deletes the branch where there is no merge queue. With
    # --auto, gh merges (or queues) at once when the PR can merge and otherwise
    # enables auto-merge, which needs "Allow auto-merge" in the repository.
    - key: V
      name: approve and merge, or auto-merge
      command: >
        gh-bg "{{.RepoName}}#{{.PrNumber}}: approve and merge" sh -c '
        [ "$(gh pr view -R "$0" "$1" --json mergeable -q .mergeable)" = MERGEABLE ]
        || { echo "not mergeable"; exit 1; };
        gh pr review --approve -R "$0" "$1" &&
        gh-pr-merge "$0" "$1" --merge --auto'
        {{.RepoName}} {{.PrNumber}}
    - key: M
      name: squash merge
      command: >
        gh-bg "{{.RepoName}}#{{.PrNumber}}: squash merge"
        gh-pr-merge {{.RepoName}} {{.PrNumber}} --squash
    - key: ctrl+v
      name: approve, no message
      command: gh pr review --approve -R {{.RepoName}} {{.PrNumber}}
    - key: ctrl+a
      builtin: approveWorkflows
    - key: I
      name: review with line comments in the editor
      command: gh-line-review {{.RepoName}} {{.PrNumber}}
    - key: K
      name: all comments, tables included
      command: GH_FORCE_TTY=100% gh pr view --comments -R {{.RepoName}} {{.PrNumber}} | less -R
    - key: F
      name: re-run failed jobs
      command: >
        gh run list -R {{.RepoName}} --status failure --json databaseId -q '.[].databaseId'
        --commit "$(gh pr view -R {{.RepoName}} {{.PrNumber}} --json headRefOid -q .headRefOid)" |
        xargs -n1 gh run rerun --failed -R {{.RepoName}}

defaults:
  prApproveComment: ""
