# Example email account configuration for generate.py.
# Copy to ~/.config/email/accounts.yaml (or symlink from your private dotfiles
# repo) and fill in your accounts. `generate.py --write` reads it and emits:
#   ~/.mbsyncrc
#   ~/.msmtprc
#   ~/.config/doom-private/email-accounts.el  (doom integration)

defaults:
  name: Your Name
  tls_type: IMAPS
  auth: plain
  imap_timeout: 120  # seconds; mbsync's own default is 20
  # certificate_file defaults to Homebrew's ca-certificates bundle
  # (<brew prefix>/share/ca-certificates/cacert.pem); set it only to override.
  msmtp_port: 587
  msmtp_tls_starttls: true

accounts:
  - name: personal
    email: you@example.com
    imap_host: imap.example.com
    smtp_host: smtp.example.com
    folders:
      - INBOX
      - Sent
    sent_folder: Sent
    drafts_folder: Drafts
    trash_folder: Trash
    search_key: p
    default: true
    # Seconds between backstop polls alongside IMAP IDLE (default 900)
    # poll_interval: 300

  # XOAUTH2 account example (Office365, Gmail):
  # - name: work
  #   email: you@example.org
  #   imap_user: you@example.org
  #   imap_host: outlook.office365.com
  #   smtp_host: smtp.office365.com
  #   auth: xoauth2
  #   password_cmd: ~/.local/bin/refresh-token
  #   msmtp_password_cmd: refresh-token --profile mail
  #   # Azure app registration that m365auth signs in through; generate.py
  #   # writes m365auth's config from it (see docs/email-xoauth2.md)
  #   oauth_client_id: 00000000-0000-0000-0000-000000000000
  #   # oauth_authority: https://login.microsoftonline.com/<tenant-id>/
  #   # Redirect registered for the app (m365auth defaults to https://localhost:7598/)
  #   # oauth_redirect_uri: http://localhost:4999/getToken
  #   # Port and HTTPS follow the URI; set these only to override it
  #   # oauth_redirect_port: 4999
  #   # oauth_use_https: false

# Optional overrides for the generated ~/.notmuch-config (defaults shown)
